name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Run inside the official Playwright container, which ships Chromium + all
    # system libs pre-installed. This removes the `playwright install` download
    # /extract step entirely — that step hung indefinitely on the bare runner
    # image after #63 (the Chrome zip reached 100% then deadlocked in extract;
    # confirmed in run-#28080975217 / #28081895036 logs). Tag must match the
    # @playwright/test version in pnpm-lock.yaml (1.59.1).
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    # Fail fast instead of hanging to the 6-hour default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      # setup-node installs the .nvmrc version inside the container (the image's
      # bundled node is overridden); the container only provides the browser.
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      # axe-core run against the SSG build via Playwright. See
      # docs/a11y-audit-2026-05.md for scope and manual follow-ups.
      # No `playwright install` step — the container already has the browser.
      - run: pnpm test:a11y
